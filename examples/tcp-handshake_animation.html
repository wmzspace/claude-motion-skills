<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCP 三次握手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：标题 → 分组步骤条 → 主舞台（步骤名 + 要点 + 画面 + 播放条 + 旁白）→ 关键数字表。全部颜色走 token。 */
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#15212C; --muted:#5D6A77; --grid:#DCE3E9; --off:#AAB4BE; --soft:#E9EEF2;
  --opt:#1F6FA8; --det:#6A4C93; --ele:#C8711F; --new:#0F7F7A; --bad:#D7263D; --good:#1B8A5A; --beam:#3FA34D;
  --optbg:#E6F0F8; --detbg:#F2EDF8; --elebg:#FCF3E7; --newbg:#E3F3F1;
  --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --panel:#141C23; --ink:#E5ECF1; --muted:#93A1AD; --grid:#25313B; --off:#4B5964; --soft:#1B252E;
  --opt:#6FB0E6; --det:#B39BDB; --ele:#F0A85A; --new:#3CC6BC; --bad:#FF5C6E; --good:#4CC38A; --beam:#7BD389;
  --optbg:#132331; --detbg:#1E1828; --elebg:#2A1F12; --newbg:#0F2623; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1318; --panel:#141C23; --ink:#E5ECF1; --muted:#93A1AD; --grid:#25313B; --off:#4B5964; --soft:#1B252E;
  --opt:#6FB0E6; --det:#B39BDB; --ele:#F0A85A; --new:#3CC6BC; --bad:#FF5C6E; --good:#4CC38A; --beam:#7BD389;
  --optbg:#132331; --detbg:#1E1828; --elebg:#2A1F12; --newbg:#0F2623; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:20px}
header h1{font-size:25px;margin:0 0 6px;text-wrap:balance;letter-spacing:.01em}
header p{margin:0;color:var(--muted);max-width:74ch}
.stepper{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px}
.grp{display:grid;gap:6px;flex:0 0 auto}
.grp .gl{font-size:12px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.grp .row{display:flex;gap:4px}
.st{font:inherit;cursor:pointer;border:0;background:none;padding:0;display:grid;justify-items:center;gap:4px;width:86px;color:var(--muted)}
.st .bar{height:4px;width:100%;border-radius:2px;background:var(--grid);overflow:hidden;position:relative}
.st .bar i{position:absolute;inset:0;width:0;background:var(--new)}
.st .nm{font-size:12px;line-height:1.3;text-align:center}
.st.done .bar i{width:100%;background:var(--off)}
.st.on{color:var(--ink);font-weight:700}
.st:hover .nm{color:var(--ink)}
.stage{background:var(--panel);border:1px solid var(--grid);border-radius:14px;overflow:hidden}
.shead{padding:16px 22px 4px;display:grid;gap:2px}
.shead .idx{font-size:12px;color:var(--muted);font-family:var(--mono)}
.shead h2{font-size:21px;margin:0;text-wrap:balance}
.shead .key{margin:2px 0 0;color:var(--muted);font-size:15px}
.scroll{overflow-x:auto}
svg#svg{display:block;width:100%;min-width:680px;height:auto}
.player{display:flex;align-items:center;gap:10px;padding:10px 22px;border-top:1px solid var(--grid);background:var(--soft)}
.player button{font:inherit;font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--grid);background:var(--panel);color:var(--ink);padding:6px 12px;white-space:nowrap}
.player button:disabled{opacity:.35;cursor:default}
.player #play{background:var(--ink);color:var(--panel);border-color:var(--ink);min-width:88px}
.player input[type=range]{flex:1;min-width:120px;accent-color:var(--new)}
.tnum{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:9ch;text-align:right}
.narr{margin:0;padding:16px 22px 6px;font-size:17px;line-height:1.85;min-height:5.8em;max-width:78ch}
.narr b{color:var(--new)}
.narr em{font-style:normal;color:var(--bad);font-weight:700}
.sfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:4px 22px 16px;font-size:13px;color:var(--muted)}
.sfoot label{display:inline-flex;align-items:center;gap:6px}
.sfoot select{font:inherit}
details.more{padding:0 22px 14px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details.more p{margin:6px 0 0;font-size:14px;color:var(--muted);max-width:78ch}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--grid);border-radius:4px;padding:0 5px;background:var(--panel)}
.ref{background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:6px 22px}
.ref summary{font-size:15px;color:var(--ink);font-weight:700;padding:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:12px}
th,td{border-bottom:1px solid var(--grid);padding:8px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ref .note{font-size:13px;color:var(--muted);margin:0 0 12px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--new);outline-offset:2px}
@media (max-width:560px){.narr{font-size:16px}header h1{font-size:21px}.player{flex-wrap:wrap;padding-inline:16px}.player input[type=range]{order:5;flex-basis:100%}.lbl,.hint{display:none}.tnum{flex:1}.shead,.narr,.sfoot,details.more{padding-inline:16px}}
svg text{font-family:var(--sans);fill:var(--ink)}
svg .mono{font-family:var(--mono)}

/* 全屏：只放舞台，画面按比例撑满 */
.stage:fullscreen{display:flex;flex-direction:column;border:0;border-radius:0;overflow-y:auto;background:var(--panel)}
.stage:fullscreen .scroll{flex:1 1 auto;min-height:0;overflow:hidden}
.stage:fullscreen svg#svg{width:100%;height:100%;min-width:0}
.stage:fullscreen details.more{display:none}
.stage:-webkit-full-screen{display:flex;flex-direction:column;width:100%;height:100%;background:var(--panel)}
.stage:-webkit-full-screen .scroll{flex:1 1 auto;min-height:0;overflow:hidden}
.stage:-webkit-full-screen svg#svg{width:100%;height:100%;min-width:0}

/* 网页编辑器 */
#edpanel{position:fixed;top:12px;right:12px;bottom:12px;width:330px;overflow:auto;z-index:20;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.14);display:grid;gap:10px;align-content:start}
#edpanel[hidden]{display:none}
body.editing .wrap{margin-right:356px}
#edpanel section{border-top:1px solid var(--grid);padding-top:8px}
#edpanel h3{font-size:13px;margin:0 0 4px;color:var(--muted);letter-spacing:.04em}
.edtop{display:flex;gap:4px;align-items:center}.edtop .sp{flex:1}
.edbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
#edpanel button{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--grid);background:var(--soft);color:var(--ink);border-radius:6px;padding:3px 8px}
#edpanel button.pri{background:var(--new);border-color:var(--new);color:var(--panel)}
#edpanel button.warn{color:var(--bad)}
#edpanel label.f{display:grid;grid-template-columns:4.8em 1fr;align-items:center;gap:6px;margin:4px 0}
#edpanel input[type=text],#edpanel input[type=number],#edpanel textarea{font:inherit;font-size:13px;width:100%;padding:3px 6px;border:1px solid var(--grid);border-radius:5px;background:var(--bg);color:var(--ink)}
#edpanel textarea{resize:vertical;min-height:2.4em}
.sw{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
#edpanel .sw button{width:20px;height:20px;padding:0;border-radius:50%}
#edpanel .sw button.on{outline:2px solid var(--ink);outline-offset:1px}
#edpanel .sw button.none{background:linear-gradient(135deg,transparent 45%,var(--bad) 45%,var(--bad) 55%,transparent 55%),var(--panel)}
.sw input[type=color]{width:24px;height:22px;padding:0;border:0;background:none}
.caprow{display:grid;grid-template-columns:4em 1fr auto;gap:4px;align-items:start;margin:4px 0}
.edhint{color:var(--muted);margin:0;font-size:12px}
.st.hid .nm{text-decoration:line-through;opacity:.6}
.player #edit.on{background:var(--new);color:var(--panel);border-color:var(--new)}
body.editing svg#svg{user-select:none;-webkit-user-select:none}
body.editing #fg *{cursor:move}
.ed-sel{fill:none;stroke:var(--new);stroke-width:1.2;stroke-dasharray:4 3;pointer-events:none}
.ed-h{fill:var(--panel);stroke:var(--new);stroke-width:1.5;cursor:nwse-resize}
#edtoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:6px 14px;border-radius:8px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#edbanner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--newbg);border:1px solid var(--new);border-radius:10px;padding:8px 14px;font-size:14px}
#edbanner button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--grid);background:var(--panel);color:var(--ink);border-radius:6px;padding:2px 10px}
@media (max-width:1000px){body.editing .wrap{margin-right:auto;padding-bottom:50vh}#edpanel{top:auto;left:8px;right:8px;width:auto;max-height:46vh}}

/* ===== UI 精修与放映模式（2026-10-11） ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[type=range]{accent-color:var(--new)}
.stepper{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);padding-right:48px;scroll-behavior:smooth}
.st .bar{height:5px;border-radius:3px}
.stage{box-shadow:0 1px 2px rgba(16,24,32,.04),0 8px 24px rgba(16,24,32,.06)}
.shead{padding:20px 26px 6px}
.shead h2{font-size:22px;line-height:1.35}
.player{gap:8px;padding:10px 18px}
.player button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;transition:background .15s,border-color .15s,color .15s}
.player button:hover:not(:disabled){border-color:var(--off)}
.player button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.player #play{width:40px;height:40px;min-width:0;padding:0;border-radius:50%}
.player #play svg{width:16px;height:16px}
.player #play svg .f{fill:currentColor;stroke:none}
.player .spd{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.player .spd input{width:96px!important}
.narr{font-size:18px;padding:18px 26px 8px}
.sfoot{padding:4px 26px 16px}
details.more{padding:0 26px 14px}
.fsprog,.fscount,.fshint{display:none}
@keyframes ui2in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage.swap .shead,.stage.swap .narr{animation:ui2in .32s ease-out backwards}
.stage.swap svg#svg{animation:ui2in .32s ease-out backwards}
@media (prefers-reduced-motion: reduce){.stage.swap .shead,.stage.swap .narr,.stage.swap svg#svg{animation:none}}
@media (max-width:560px){.player .spd{order:4}.player .spd input{width:72px!important}.shead,.narr,.sfoot,details.more{padding-inline:16px}}

/* 放映模式：像幻灯片放映一样只留画面、标题与字幕；控件在鼠标移动时浮出，静止 2 秒后隐去 */
.stage.is-fs{display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none;background:var(--panel);position:relative;overflow:hidden}
.stage.is-fs .shead{padding:clamp(30px,5vh,64px) clamp(32px,6vw,120px) 0;gap:8px;max-width:none}
.stage.is-fs .shead .idx{font-size:clamp(12px,.8vw,15px);letter-spacing:.08em}
.stage.is-fs .shead h2{font-size:clamp(26px,2.5vw,48px);line-height:1.25;max-width:44ch}
.stage.is-fs .shead .key{font-size:clamp(16px,1.3vw,24px);max-width:70ch}
.stage.is-fs .scroll{min-height:0;overflow:hidden;padding:clamp(8px,2vh,28px) clamp(24px,5vw,96px)}
.stage.is-fs svg#svg{width:100%;height:100%;min-width:0;cursor:pointer}
.stage.is-fs .narr{margin:0 auto;max-width:min(62ch,86vw);min-height:0;text-align:center;font-size:clamp(19px,1.6vw,32px);line-height:1.6;padding:0 32px clamp(30px,5.5vh,64px);transition:transform .28s ease}
.stage.is-fs.ui-on .narr,.stage.is-fs:has(.player :focus-visible) .narr{transform:translateY(-76px)}
.stage.is-fs .narr{width:100%;box-sizing:border-box}   /* 放映时字幕框宽度固定，不随文字长短收缩 */
.stage.is-fs details.more,.stage.is-fs .sfoot{display:none}
.stage.is-fs .player{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(1040px,calc(100% - 48px));border:1px solid var(--grid);border-radius:18px;padding:10px 14px;
  background:color-mix(in srgb,var(--panel) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 16px 48px rgba(0,0,0,.22);transition:opacity .25s ease,transform .25s ease;z-index:6}
.stage.is-fs:not(.ui-on) .player:not(:has(:focus-visible)){opacity:0;transform:translate(-50%,14px);pointer-events:none}
.stage.is-fs .player .lbl{display:none}
.stage.is-fs .player button{background:transparent;border-color:transparent}
.stage.is-fs .player button:hover:not(:disabled){background:var(--soft)}
.stage.is-fs .player #play{background:var(--ink);color:var(--panel)}
.stage.is-fs.idle,.stage.is-fs.idle svg#svg{cursor:none}
.stage.is-fs .fsprog{display:flex;gap:3px;position:absolute;top:0;left:0;right:0;height:4px;z-index:5}
.fsprog i{flex:1;background:var(--grid);position:relative;overflow:hidden}
.fsprog i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--new)}
.fsprog i.done b{width:100%;background:var(--off)}
.stage.is-fs .fscount{display:block;position:absolute;top:clamp(30px,5vh,64px);right:clamp(32px,6vw,120px);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(13px,.9vw,16px);color:var(--muted);z-index:5}
.stage.is-fs .fshint{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:12px;background:color-mix(in srgb,var(--ink) 86%,transparent);color:var(--panel);font-size:15px;white-space:nowrap;z-index:7;opacity:0;pointer-events:none;transition:opacity .4s}
.stage.is-fs .fshint.on{opacity:1}
.fshint .kbd{color:var(--ink);margin:0 4px}
.stage.is-fs #edit{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TCP 三次握手：连接是怎么建立的</h1>
    <p>animation-html 示例：四步讲清客户端和服务器如何确认「彼此都能收发」。</p>
  </header>
  <nav class="stepper" id="flow" aria-label="步骤"></nav>
  <section class="stage">
    <div class="shead"><span class="idx" id="idx"></span><h2 id="title"></h2><p class="key" id="key"></p></div>
    <div class="scroll"><svg id="svg" viewBox="0 0 960 500" role="img" aria-label="动画画面"><defs id="defs"></defs><g id="fg"></g></svg></div>
    <div class="player">
      <button id="prev" aria-label="上一步">←<span class="lbl"> 上一步</span></button>
      <button id="play">暂停</button>
      <input id="slider" type="range" min="0" max="10" step="0.05" value="0" aria-label="时间">
      <span class="tnum" id="tlabel"></span>
      <button id="next" aria-label="下一步"><span class="lbl">下一步 </span>→</button>
      <button id="fs" aria-label="全屏播放" title="全屏（F）">全屏</button>
    </div>
    <p class="narr" id="caption" aria-live="polite"></p>
    <details class="more"><summary>这一步的细节与限制</summary><p id="note"></p></details>
    <div class="sfoot">
      <span class="hint"><span class="kbd">空格</span> 播放 / 暂停　<span class="kbd">←</span> 上一步　<span class="kbd">→</span> 跳到本步结尾，再按进下一步　<span class="kbd">F</span> 全屏放映（放映时点击画面进下一步）</span>
      <span><label for="speed">速度 <input id="speed" type="range" min="0.5" max="4" step="0.1" value="2" style="width:110px" oninput="document.getElementById('speedv').textContent=parseFloat(this.value).toFixed(1)+'×'"><span id="speedv" class="tnum" style="min-width:2.6em">2.0×</span></label>
      <label for="auto"><input type="checkbox" id="auto">播完自动进下一步</label>
      <button id="replay" style="font:inherit;font-size:13px;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline">重播这一步</button></span>
    </div>
  </section>
  <details class="ref">
    <summary>关键数字与出处</summary>
    <table id="reftab"></table>
    <p class="note">出处：RFC 9293 §3.5。</p>
  </details>
</div>
<script id="edits" type="application/json">{}</script>
<script>

}

function plate(x,y,h,img,op){ // 斜放的薄板（可贴图）

    edBtn("还原本步文字",()=>edAct(()=>{ delete edE().f; edRebuild(); }),"warn")]));
}
function edPanelPage(){
  const pb=$("edpage"); pb.innerHTML=""; pb.appendChild(edMk("h3",{text:"整页"}));
  const h=document.querySelector("header h1"), p=document.querySelector("header p");
  pb.appendChild(edInput("大标题",ED.page.h1??(h?h.textContent:""),v=>{ ED.page.h1=v; edApplyPage(); },{area:true}));
  pb.appendChild(edInput("导语",ED.page.lead??(p?p.textContent:""),v=>{ ED.page.lead=v; edApplyPage(); },{area:true,rows:3}));
  const clr=edBtn("清除全部网页修改",()=>{ if(clr.dataset.c){ edAct(()=>{ ED={v:1,page:{},steps:{},ins:[]}; edSelK=null; edApplyPage(); edRebuild(); buildStepper(); }); }
    else { clr.dataset.c=1; clr.textContent="再点一次确认清除"; setTimeout(()=>{ if(clr.isConnected){ delete clr.dataset.c; clr.textContent="清除全部网页修改"; } },3000); } },"warn");
  pb.appendChild(edMk("div",{class:"edbar"},[clr]));
}
</script>
<script>
/* ===== UI 精修与放映模式（2026-10-11）：图标按钮、速度并入播放条、放映模式（控件自动隐藏、点击下一步、分段进度、换步淡入） ===== */
(function(){
  const $=id=>document.getElementById(id), stage=document.querySelector(".stage"), player=document.querySelector(".player");
  const S=(p,extra)=>`<svg viewBox="0 0 24 24" aria-hidden="true"${extra||""}>${p}</svg>`;
  const I={prev:S('<path d="M15 6l-6 6 6 6"/>'), next:S('<path d="M9 6l6 6-6 6"/>'),
    play:S('<path class="f" d="M7 4.8v14.4L19.5 12z"/>'), pause:S('<rect class="f" x="6" y="4.5" width="4" height="15" rx="1.2"/><rect class="f" x="14" y="4.5" width="4" height="15" rx="1.2"/>'),
    fs:S('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'), fsx:S('<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>')};
  const setBtn=(b,svg,lbl,title)=>{ b.innerHTML=svg+`<span class="lbl">${lbl}</span>`; b.setAttribute("aria-label",lbl); if(title) b.title=title; };
  setBtn($("prev"),I.prev,"上一步","上一步（←）");
  $("next").innerHTML=`<span class="lbl">下一步</span>`+I.next; $("next").setAttribute("aria-label","下一步"); $("next").title="下一步（→）";
  // 播放 / 全屏按钮的文字由原播放器代码写入；监听后换成图标（已是图标时不再处理，避免循环）
  const watch=(b,fn)=>{ fn(); new MutationObserver(()=>{ if(!b.querySelector("svg")) fn(); }).observe(b,{childList:true,characterData:true,subtree:true}); };
  watch($("play"),()=>{ const p=$("play"), s=p.textContent.trim()||"暂停"; p.innerHTML=(s==="暂停"?I.pause:I.play)+`<span class="sr">${s}</span>`; p.setAttribute("aria-label",s); p.title=s+"（空格）"; });
  watch($("fs"),()=>{ const f=$("fs"), on=/退出/.test(f.textContent); setBtn(f,on?I.fsx:I.fs,on?"退出放映":"放映",on?"退出放映（Esc）":"全屏放映（F）"); });
  // 速度并入播放条
  const sl=document.querySelector('label[for="speed"]'); if(sl){ sl.classList.add("spd"); player.insertBefore(sl,$("fs")); }
  // 放映模式附件：分段进度、页码、提示
  const prog=document.createElement("div"); prog.className="fsprog"; prog.setAttribute("aria-hidden","true");
  const cnt=document.createElement("span"); cnt.className="fscount";
  const hint=document.createElement("div"); hint.className="fshint"; hint.setAttribute("role","status");
  hint.innerHTML='点击画面或 <span class="kbd">→</span> 下一步　<span class="kbd">空格</span> 暂停　<span class="kbd">Esc</span> 退出';
  stage.prepend(prog,cnt); stage.appendChild(hint);
  function upd(){ const n=STEPS.length;
    if(prog.childElementCount!==n){ prog.innerHTML=""; for(let i=0;i<n;i++){ const e=document.createElement("i"); e.appendChild(document.createElement("b")); prog.appendChild(e); } }
    [...prog.children].forEach((e,i)=>{ e.classList.toggle("done",i<cur); e.firstChild.style.width = i===cur ? (100*t/STEPS[cur].dur)+"%" : ""; });
    cnt.textContent=`${String(cur+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`;
    const g=STEPS[cur].g+(STEPS[cur].hidden?"（已隐藏）":"");   // 放映时左上只写分组，页码放右上
    $("idx").textContent = stage.classList.contains("is-fs") ? g : `第 ${cur+1} 步 / 共 ${n} 步 · ${g}`; }
  const _render=render; render=function(){ _render(); upd(); };
  const _go=go; go=function(i){ const c0=cur; _go(i); if(cur!==c0 || i===c0){ stage.classList.remove("swap"); void stage.offsetWidth; stage.classList.add("swap"); } upd(); };
  // 放映：进入 / 退出
  let idleT=null, hintT=null;
  const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  function wake(){ if(!stage.classList.contains("is-fs")) return; stage.classList.add("ui-on"); stage.classList.remove("idle"); clearTimeout(idleT);
    idleT=setTimeout(()=>{ if(!player.matches(":hover")){ stage.classList.remove("ui-on"); stage.classList.add("idle"); } },2000); }
  function onFS(){ const on=isFS(); stage.classList.toggle("is-fs",on); stage.classList.remove("ui-on","idle");
    if(on){ hint.classList.add("on"); clearTimeout(hintT); hintT=setTimeout(()=>hint.classList.remove("on"),2600); stage.classList.add("idle"); }
    else hint.classList.remove("on");
    render(); }
  document.addEventListener("fullscreenchange",onFS); document.addEventListener("webkitfullscreenchange",onFS);
  stage.addEventListener("mousemove",wake); stage.addEventListener("touchstart",wake,{passive:true});
  // 放映时点击画面 = 下一步（动画没播完先跳到本步结尾，与 → 键一致）
  function advance(){ if(t<STEPS[cur].dur-1e-3){ t=STEPS[cur].dur; playing=false; hold=0; $("play").textContent="播放"; render(); } else if(cur<STEPS.length-1) go(cur+1); }
  $("svg").addEventListener("click",()=>{ if(stage.classList.contains("is-fs") && !document.body.classList.contains("editing")) advance(); });
  // 翻页笔 / 幻灯片习惯键：PageDown、↓、Enter 下一步；PageUp、↑ 上一步；Home / End 首尾
  document.addEventListener("keydown",e=>{ const tg=e.target, free=tg===document.body||tg===stage||tg===document.documentElement;
    if(["INPUT","SELECT","TEXTAREA"].includes(tg.tagName)&&tg.type!=="range"||tg.isContentEditable||e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==="PageDown"||(e.key==="Enter"&&free)||(e.key==="ArrowDown"&&stage.classList.contains("is-fs"))){ e.preventDefault(); advance(); }
    else if(e.key==="PageUp"||(e.key==="ArrowUp"&&stage.classList.contains("is-fs"))){ e.preventDefault(); go(cur-1); }
    else if(e.key==="Home"&&free){ e.preventDefault(); go(0); } else if(e.key==="End"&&free){ e.preventDefault(); go(STEPS.length-1); } });
  // 放映时字幕框高度按本步所有字幕里最高的那句定死：一步之内换句不再改变行高，画面也不会被挤得上下跳
  const narr=$("caption"), meas=narr.cloneNode(false);
  meas.removeAttribute("id"); meas.removeAttribute("aria-live"); meas.setAttribute("aria-hidden","true");
  meas.style.cssText="position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;height:auto;transform:none;transition:none;animation:none;box-sizing:border-box";
  stage.appendChild(meas);
  const hOf=new Map(); let hMax=0;
  function fitNarr(){ if(!stage.classList.contains("is-fs")){ narr.style.height=""; narr.style.paddingTop=""; return; }
    narr.style.height=""; meas.style.width=narr.getBoundingClientRect().width+"px"; let h=0;
    hOf.clear(); for(const [,txt] of STEPS[cur].cap){ meas.innerHTML=txt; const x=meas.getBoundingClientRect().height; hOf.set(txt,x); h=Math.max(h,x); }
    narr.style.boxSizing="border-box"; narr.style.height=Math.ceil(h)+"px"; hMax=Math.ceil(h); centerNarr(); }
  function centerNarr(){ if(!stage.classList.contains("is-fs")){ narr.style.paddingTop=""; return; }
    const x=hOf.get(narr.dataset.c); narr.style.paddingTop = x ? Math.max(0,(hMax-x)/2)+"px" : ""; }
  const _r2=render; render=function(){ _r2(); centerNarr(); };
  const _go2=go; go=function(i){ _go2(i); fitNarr(); };
  document.addEventListener("fullscreenchange",fitNarr); document.addEventListener("webkitfullscreenchange",fitNarr);
  addEventListener("resize",fitNarr); if(document.fonts) document.fonts.ready.then(fitNarr);
  upd();
})();
</script>
